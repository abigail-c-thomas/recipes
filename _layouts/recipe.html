---
layout: default
---
<!-- Custom Recipe Layout -->
<link rel="stylesheet" href="{{ "/css/recipe-card.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/css/historical-quote.css" | relative_url }}">

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<script src="{{ "/js/recipe-card.js" | relative_url }}"></script>
